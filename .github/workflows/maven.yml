name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Scarica il repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 1: Compilazione - fase compile
      - name: Compile
        run: mvn compile

      # Step 2: Esecuzione test - fase test
      - name: Test
        run: mvn test

      # Step 3: Analisi statica - fase package
      - name: Static analysis
        run: mvn package
