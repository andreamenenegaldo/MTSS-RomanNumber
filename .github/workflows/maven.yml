name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Scarica il repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 1: Compilazione - fase compile
      - name: Compile
        run: mvn compile

      # Step 2: Esecuzione test - fase test
      - name: Test
        run: mvn test

      # Step 3: Analisi statica - fase package
      - name: Static analysis
        run: mvn package

      # Step 4: Build and test - fase verify
      - name: Build and test
        run: mvn verify

      # Step 5: Coverage report (Coveralls)
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: target/site/jacoco/jacoco.xml
